name: Vercel Deployment Monitor

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Vercel CLI
      run: npm install -g vercel@latest
      
    - name: Run build test
      run: npm run build
      
    - name: Check build output
      run: |
        echo "Build completed successfully!"
        ls -la dist/
        echo "Checking index.html content:"
        cat dist/index.html
        
    - name: Deploy to Vercel (Preview)
      if: github.event_name == 'pull_request'
      run: |
        vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --scope=team_ankish_8_3da9f5
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Deploy to Vercel (Production)
      if: github.ref == 'refs/heads/master'
      run: |
        vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=team_ankish_8_3da9f5
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Check Vercel deployment status
      run: |
        echo "Checking deployment status..."
        vercel ls --token=${{ secrets.VERCEL_TOKEN }} --scope=team_ankish_8_3da9f5
        
    - name: Run comprehensive deployment check
      run: npm run check-deploy
      
    - name: Comment on PR - Success
      if: github.event_name == 'pull_request' && success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Build and deployment successful! Vercel preview is ready.'
          })
      
    - name: Comment on PR - Failure
      if: github.event_name == 'pull_request' && failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ Build or deployment failed! Check the logs for details. Auto-fixing will be attempted.'
          })